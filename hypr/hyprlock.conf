# ==========================================
# HYPRLOCK — GRAPHITE / FEDORA BLUE
# ==========================================

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# Background
background {
    monitor =
    path = $HOME/Pictures/wallpaper.png
    blur_passes = 2
    blur_size = 5
    noise = 0.02
    contrast = 0.95
    brightness = 0.65
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(d6d6d6)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgb(51a2da)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(3c6eb4)
    inner_color = rgb(111111)
    font_color = rgb(d6d6d6)

    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>
    rounding = 10

    position = 0, -100
    halign = center
    valign = center
}
