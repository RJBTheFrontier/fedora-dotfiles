
# ==========================================================
# KITTY CONFIGURATION
# Theme: Graphite x Fedora Blue
# Platform: Fedora Linux / Hyprland
# Font: JetBrainsMono Nerd Font
# ==========================================================


# ----------------------------------------------------------
# 01. FONT
# ----------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.5


# ----------------------------------------------------------
# 02. BACKGROUND & FOREGROUND
# ----------------------------------------------------------

background #111111
foreground #D6D6D6

background_opacity 1.0

selection_foreground #FFFFFF
selection_background #294B73


# ----------------------------------------------------------
# 03. CURSOR
# ----------------------------------------------------------

cursor #51A2DA
cursor_text_color #111111

cursor_shape block
cursor_blink_interval 0


# ----------------------------------------------------------
# 04. FEDORA BLUE ACCENTS
# ----------------------------------------------------------

url_color #3C6EB4
active_border_color #3C6EB4
inactive_border_color #333333
bell_border_color #3C6EB4

detect_urls yes


# ----------------------------------------------------------
# 05. ANSI COLOR PALETTE
# ----------------------------------------------------------

# Normal colors

color0  #242424
color1  #A06B6B
color2  #8DAA91
color3  #B5A477
color4  #3C6EB4
color5  #9B8BB5
color6  #82AEB5
color7  #D6D6D6

# Bright colors

color8  #555555
color9  #C08080
color10 #A7C5AB
color11 #D0BA8B
color12 #51A2DA
color13 #B5A4CE
color14 #9CCBD1
color15 #F2F2F2


# ----------------------------------------------------------
# 06. WINDOW SPACING
# ----------------------------------------------------------

window_padding_width 12
window_border_width 1.5

draw_minimal_borders yes


# ----------------------------------------------------------
# 07. TAB BAR
# ----------------------------------------------------------

tab_bar_style fade
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_edge top

tab_bar_background #111111

active_tab_foreground #FFFFFF
active_tab_background #294B73
active_tab_font_style bold

inactive_tab_foreground #999999
inactive_tab_background #222222
inactive_tab_font_style normal


# ----------------------------------------------------------
# 08. SCROLLBACK
# ----------------------------------------------------------

scrollback_lines 10000
wheel_scroll_multiplier 3.0


# ----------------------------------------------------------
# 09. SHELL INTEGRATION
# ----------------------------------------------------------

shell_integration enabled


# ----------------------------------------------------------
# 10. BEHAVIOR
# ----------------------------------------------------------

enable_audio_bell no
mouse_hide_wait 3.0

confirm_os_window_close 0


# ==========================================================
# END OF CONFIGURATION
# ==========================================================
